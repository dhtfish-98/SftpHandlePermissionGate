name: Verify SFTP handle gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: python -m pip install --disable-pip-version-check build==1.3.0 paramiko==5.0.0
      - run: python scripts/run_validation.py --build-root Build/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sftp-validation-${{ matrix.python-version }}
          path: |
            Build/validation/validation.json
            Build/validation/*.log
